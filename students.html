<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <nav>
        <div class="nav-inner">
            <a class="nav-logo" href="index.html">
                🎓 <span>Student Management</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="students.html" class="active">Students</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </nav>

    <div class="students-wrap">

        <h3 id="studentsCount"></h3>

        <div class="search-bar">
            <input
                type="text"
                id="searchInput"
                placeholder="Search by name or ID..."
                onkeyup="filterStudents()"
            >
            <select id="filterDept" onchange="filterStudents()">
                <option value="">All Departments</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Systems">Information Systems</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
            </select>
            <select id="filterStatus" onchange="filterStudents()">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="Graduated">Graduated</option>
            </select>
            <button class="btn-add" onclick="openModal()">+ Add Student</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>GPA</th>
                        <th>Grade</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTable"></tbody>
            </table>
        </div>

    </div>

    <!-- Add Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>Add New Student</h3>
            <input type="text" id="addName" placeholder="Full Name" />
            <input type="text" id="addId" placeholder="Student ID" />
            <select id="addDept">
                <option value="">Select Department</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Systems">Information Systems</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
            </select>
            <input type="number" id="addYear" placeholder="Year (1-4)" min="1" max="4" />
            <input type="number" id="addGpa" placeholder="GPA (0.0 - 4.0)" step="0.1" min="0" max="4" />
            <select id="addStatus">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="Graduated">Graduated</option>
            </select>
            <div class="modal-btns">
                <button class="btn-confirm" onclick="addStudent()">Add</button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModalOverlay">
        <div class="modal">
            <h3>Update Student</h3>
            <input type="text" id="editName" placeholder="Full Name" />
            <select id="editDept">
                <option value="">Select Department</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Systems">Information Systems</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
            </select>
            <input type="number" id="editYear" placeholder="Year (1-4)" min="1" max="4" />
            <input type="number" id="editGpa" placeholder="GPA (0.0 - 4.0)" step="0.1" min="0" max="4" />
            <select id="editStatus">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="Graduated">Graduated</option>
            </select>
            <div class="modal-btns">
                <button class="btn-confirm" onclick="saveEdit()">Save</button>
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <footer>
        <strong>Student Management System</strong> — &copy; 2026
    </footer>

    <script src="app.js"></script>
    <script src="search.js"></script>

</body>
</html>
